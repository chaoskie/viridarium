<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Viridarium</title>

    <!--
      Theme fonts (FE-001 lock) are self-hosted via @fontsource and imported by
      the bundle (src/styles/fonts.ts): same-origin under the strict CSP and
      fully offline (VIRIDARIUM-37).

      theme-init.js applies the persisted theme before paint; it stays a
      blocking same-origin script so it runs ahead of the bundle. Its KEY and
      theme list mirror src/lib/theme/themeController.ts.
    -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
