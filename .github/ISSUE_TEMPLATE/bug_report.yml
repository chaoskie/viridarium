name: Bug report
description: Something is broken
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: App version (footer or /api/v1/health)
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: deploy
    attributes:
      label: Deployment method
      options:
        - docker compose
        - docker run
        - bare metal / dev setup
        - other
    validations:
      required: true
  - type: dropdown
    id: database
    attributes:
      label: Database
      options:
        - SQLite (default)
        - PostgreSQL
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Container logs around the failure. Remove anything personal.
      render: shell
